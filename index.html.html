<!DOCTYPE html>
<html>
<head>
    <title>FunLand</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #fff0d9;
            margin: 0;
        }

        h1 {
            background: #32145c;
            color: white;
            padding: 30px;
        }

        p {
            font-size: 18px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 15px auto;
            width: 200px;
            border-radius: 12px;
            color: #32145c;
        }

        button {
            background: #ff9900;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎡 Welcome to FunLand!</h1>

    <p>Your world of fun and adventure!</p>

    <h2>Our Attractions</h2>

    <div class="card">🎢 Roller Coaster</div>
    <div class="card">🎡 Giant Wheel</div>
    <div class="card">💦 Water Park</div>

    <h2>Tickets: ₹500</h2>

    <button onclick="book()">Book Now</button>

    <p id="msg"></p>

    <script>
        function book() {
            document.getElementById("msg").innerHTML =
            "Thank you for choosing FunLand! 🎉";
        }
    </script>

</body>
</html>
